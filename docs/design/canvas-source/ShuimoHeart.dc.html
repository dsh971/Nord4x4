<style>

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 32px; background: #F9F8F4; color: #1C1B1A; font-family: Inter, sans-serif; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="ShuimoLevel.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #5C564E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>

    <div style="display: flex; gap: 4px; flex: 1" aria-label="Onboarding progress">
      <div style="flex: 1; height: 3px; background: #1C1B1A"></div><div style="flex: 1; height: 3px; background: #1C1B1A"></div><div style="flex: 1; height: 3px; background: #1C1B1A"></div><div style="flex: 1; height: 3px; background: #DDDBD5"></div>
    </div>
  </div>

  <div style="margin-top: 28px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #6E6962">Heart</div>
  <h1 style="margin: 10px 0 0; font-family: 'Noto Serif SC', serif; font-weight: 300; font-size: 34px; line-height: 1.2">Find your heart's <span style="font-weight: 600; color: #0E0D0C">ceiling</span>.</h1>
  <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: #5C564E">Targets become real beats per minute.</p>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; margin-top: 24px; padding: 2px; border-radius: 4px; background: #F1F0EB; border: 1px solid rgba(28,27,26,0.08)">
    <button style="height: 40px; border-radius: 2px; border: 1px solid rgba(28,27,26,0.14); background: #FFFFFF; color: #1C1B1A; font-family: Inter, sans-serif; font-weight: 500; font-size: 14px">Use my age</button>
    <button style="height: 40px; border-radius: 2px; border: none; background: transparent; color: #5C564E; font-family: Inter, sans-serif; font-weight: 500; font-size: 14px">I know my max</button>
  </div>

  <label for="sm-age" style="display: block; margin-top: 20px; font-size: 13px; font-weight: 500; color: #5C564E">Age</label>
  <div style="display: flex; align-items: center; gap: 16px; margin-top: 8px">
    <input id="sm-age" value="34" inputmode="numeric" style="width: 88px; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 4px; border: 1px solid rgba(28,27,26,0.14); background: #FFFFFF; color: #1C1B1A; font-family: 'Noto Serif SC', serif; font-size: 22px">
    <div style="font-size: 14px; color: #5C564E">Estimated max <span style="font-family: 'Noto Serif SC', serif; font-size: 22px; color: #1C1B1A">184</span> bpm</div>
  </div>

  <div style="margin-top: 28px; background: #FFFFFF; border: 1px solid rgba(28,27,26,0.14); border-radius: 4px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 6px; height: 36px; background: #C66B22"></div>
        <div>
          <div style="font-weight: 500; font-size: 16px">Push</div>
          <div style="font-size: 13px; color: #6E6962">4x4 work blocks · 85–95%</div>
        </div>
      </div>
      <div style="font-family: 'Noto Serif SC', serif; font-size: 24px; color: #9F5217">156–175</div>
    </div>
    <div style="height: 1px; background: rgba(28,27,26,0.08)"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 6px; height: 36px; background: #4A8475"></div>
        <div>
          <div style="font-weight: 500; font-size: 16px">Steady</div>
          <div style="font-size: 13px; color: #6E6962">Easy rows and rests · 60–70%</div>
        </div>
      </div>
      <div style="font-family: 'Noto Serif SC', serif; font-size: 24px; color: #1F6357">110–129</div>
    </div>
    <div style="height: 6px; display: flex; margin: 0 16px 16px" aria-hidden="true">
      <div style="flex: 60; background: #EBE5D8"></div><div style="flex: 10; background: #4A8475"></div><div style="flex: 15; background: #EBE5D8"></div><div style="flex: 10; background: #C66B22"></div><div style="flex: 5; background: #EBE5D8"></div>
    </div>
  </div>
  <div style="margin-top: 10px; font-size: 13px; color: #6E6962">An estimate. Change it any time in Settings.</div>
  <label style="display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 44px; font-size: 14px; color: #1C1B1A"><input type="checkbox" style="width: 20px; height: 20px; margin: 0"> My heart rate is affected by medication</label>

  <div style="flex: 1"></div>
  <a href="ShuimoWeek.dc.html" style="height: 48px; border-radius: 4px; background: #1E4D2B; color: #F9F8F4; font-weight: 500; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</x-dc>
