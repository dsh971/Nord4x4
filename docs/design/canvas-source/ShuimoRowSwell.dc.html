      <span style="font-size: 13px; color: #6E6962">left</span>

    </div>
    <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 10px">
      <span style="font-family: 'Noto Serif SC', serif; font-size: 26px; line-height: 1; color: #1C1B1A">20–24</span>
      <span style="font-size: 14px; color: #6E6962">drum spm</span>
    </div>

  <a href="ShuimoPause.dc.html" style="position: absolute; left: 16px; bottom: 48px; padding: 3px 8px; background: rgba(249,248,244,0.9); font-size: 13px; color: #5C564E; text-decoration: none">Hold anywhere to pause</a>
